name: Deploy site

on:
  push:
    branches: [main]
    # A change to this workflow is itself worth deploying, so the deploy that a
    # fix produces is the one that proves the fix.
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build-docs-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # The public docs site belongs to the upstream repository.
    if: github.repository == 'QinIndexCode/nami-mail'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node.js 24)
        with:
          node-version: 22.14.0
          cache: npm
      # The pages are pre-rendered from `docs/`, which needs the Markdown parser
      # declared in the root package. `--ignore-scripts` skips the repository's
      # postinstall, which downloads the Electron runtime that a static site
      # build has no use for.
      - name: Install the build dependencies
        run: npm ci --ignore-scripts
      - name: Build the site from docs/
        run: node scripts/build-docs-site.mjs
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6 (Node.js 24)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5 (Node.js 24)
