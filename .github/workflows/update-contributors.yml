name: Update contributors

# Runs daily at 03:00 UTC or manually. Opens or updates a PR only when a
# contributor README changes; the workflow has no push trigger.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # v7.0.1 (Node.js 24); the PR action receives its own token explicitly.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        # v7.0.0 runs on Node.js 24; the project script uses Node 22.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0

      - name: Fetch contributors and update READMEs
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/update-contributors.mjs

      - name: Open or update contributor pull request
        if: steps.update.outputs.changed == 'true'
        # v8 uses Node.js 24; this third-party action is restricted to this exact SHA.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            README.md
            README.zh-CN.md
            README.en.md
          commit-message: "chore: update contributor list"
          branch: chore/update-contributors
          delete-branch: true
          title: "chore: update contributor list"
          body: |
            Automated contributor list refresh.

            This PR changes only the contributor sections in README.md,
            README.zh-CN.md, and README.en.md. Please let the validate check pass
            before merging.
          labels: "automated,documentation"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
