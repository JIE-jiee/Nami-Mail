name: Update contributors

# Runs daily at 03:00 UTC or manually. This low-risk generated README update
# commits directly to main and intentionally has no push trigger.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        # v7.0.1; keep credentials so this workflow can push its README-only commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Setup Node
        # v7.0.0 runs on Node.js 24; the project script uses Node 22.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0

      - name: Fetch contributors and update READMEs
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/update-contributors.mjs

      - name: Commit contributor changes
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md README.zh-CN.md README.en.md
          if git diff --cached --quiet; then
            echo "Contributor READMEs are already up to date."
            exit 0
          fi
          git commit -m "chore: update contributor list [skip ci]"
          git push origin HEAD:main
