name: Sync Wiki

# Maintains the GitHub Wiki from the docs/ directory: generates a flat
# two-language page tree (scripts/wiki-sync.mjs), merges it into the
# <owner>/<repo>.wiki clone, and commits only real changes. The default
# GITHUB_TOKEN can push to the wiki of its own repository, so no secret is
# needed. The merge keeps hand-written wiki pages and only removes pages a
# previous sync generated (tracked in .wiki-sync.json).
#
# The wiki must be enabled in repository settings. If the wiki repository has
# never been created (no page exists yet), the checkout step fails with a
# clear error; create any page in the wiki UI once, then re-run this workflow.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/wiki-sync.mjs"
      - "scripts/wiki-sync.test.mjs"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  sync:
    # This wiki is maintained by the upstream repository, not this fork.
    if: github.repository == 'QinIndexCode/nami-mail'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # v7.0.1 (Node.js 24); keep source checkout credentials out of generated docs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0 (Node.js 24).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - name: Generate wiki tree
        run: node scripts/wiki-sync.mjs --out "$RUNNER_TEMP/wiki-tree"
      # The wiki is a separate git repository owned by the same account; the
      # default token has push access to it alongside the main repository.
      - name: Checkout wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}.wiki
          token: ${{ secrets.GITHUB_TOKEN }}
          path: wiki
      - name: Merge generated tree
        run: node scripts/wiki-sync.mjs --sync --tree "$RUNNER_TEMP/wiki-tree" --wiki wiki
      - name: Commit and push
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Wiki is up to date; nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "docs: sync wiki from docs/ (${{ github.sha }})"
          git push
