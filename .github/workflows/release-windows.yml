name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      # v7.0.1 (Node.js 24); keep this action pinned for the secret-free validation job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The promote step reads docs/releases/v<version>.md. A missing file used
      # to surface only after the release job had signed, packaged, and uploaded
      # assets (burning a runner plus an approval). Fail here, before any heavy
      # check, with an actionable message.
      - run: node scripts/verify-release-notes.mjs
      # v7.0.0 (Node.js 24); keep this action pinned for the secret-free validation job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run verify:node-sqlite
      - run: npm run verify:electron-sqlite
      - run: npm run smoke:server-node
      - run: npm run build:brand:check
      # Every script-level invariant lives in scripts/tests/ and is discovered
      # by this one run (a placement guard fails if a test is filed elsewhere).
      - run: node --test "scripts/tests/*.test.mjs"
      - run: node scripts/build-docs-site.mjs
      - run: node scripts/build-locale-catalog.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run test:desktop-security
      - run: npm run smoke:runtime
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run verify:electron-sqlite && node scripts/smoke-desktop.mjs
      - run: npm audit --omit=dev --audit-level=high

  release:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      NAMI_MAIL_GITHUB_REPOSITORY: ${{ github.repository }}
      NAMI_MAIL_RELEASE_DIRECTORY: release-artifacts/${{ github.ref_name }}
    steps:
      # v7.0.1 (Node.js 24); keep this action pinned before this job receives release secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0 (Node.js 24); keep this action pinned before this job receives release secrets.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Sign, upload draft, and run package smoke
        timeout-minutes: 30
        run: npm run publish:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          NAMI_MAIL_EXPECTED_WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_CSC_PUBLISHER }}
          NAMI_MAIL_EXPECTED_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CSC_THUMBPRINT }}
          NAMI_MAIL_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.NAMI_MAIL_UPDATE_ED25519_PRIVATE_KEY }}
      - name: Verify remote draft and publish stable release
        run: node scripts/promote-github-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0 (Node.js 24)
        with:
          name: release-smoke-diagnostics-${{ github.ref_name }}
          path: |
            output/desktop-smoke-diagnostic.json
            output/installer-smoke-diagnostic.json
            output/package-smoke-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
